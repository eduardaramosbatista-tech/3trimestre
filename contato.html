<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jardim - Trabalho Front-End</title>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="tela"></canvas>

  <script>
    const canvas = document.getElementById('tela');
    const ctx = canvas.getContext('2d');

    // Deixa a animação ocupando toda a tela na horizontal
    function ajustar() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', ajustar);
    ajustar();

    let tempo = 0;
    const cores = ['#ff7675', '#fdcb6e', '#ff9ff3', '#74b9ff'];
    const arvores = [];

    // Cria 15 sementes espalhadas na horizontal
    for (let i = 0; i < 15; i++) {
      arvores.push({
        x: 60 + Math.random() * (canvas.width - 120),
        y: -Math.random() * 400,
        vel: 1.5 + Math.random(),
        noChao: false,
        tronco: 0,
        maxTronco: 60 + Math.random() * 60,
        copa: 0,
        cor: cores[i % cores.length],
        vida: 0
      });
    }

    function animar() {
      tempo += 0.008;
      // Alterna automaticamente entre dia (1) e noite (0)
      const luz = (Math.sin(tempo) + 1) / 2;

      // Céu mudando de azul claro (dia) para azul escuro (noite)
      ctx.fillStyle = `rgb(${20 + luz * 115}, ${30 + luz * 176}, ${60 + luz * 190})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Sol se movendo no céu durante o dia
      const solY = canvas.height - (luz * (canvas.height - 100));
      ctx.fillStyle = '#ffeaa7';
      ctx.beginPath();
      ctx.arc(canvas.width * 0.8, solY, 40, 0, Math.PI * 2);
      ctx.fill();

      // Chão verde do jardim
      const chao = canvas.height - 40;
      ctx.fillStyle = luz > 0.3 ? '#2ecc71' : '#1e8449';
      ctx.fillRect(0, chao, canvas.width, 40);

      // Atualiza e desenha cada flor virando árvore
      arvores.forEach(a => {
        if (!a.noChao) {
          // 1. Flor caindo
          a.y += a.vel;
          ctx.fillStyle = a.cor;
          ctx.beginPath();
          ctx.arc(a.x, a.y, 6, 0, Math.PI * 2);
          ctx.fill();

          if (a.y >= chao) a.noChao = true;
        } else {
          // 2. Cresce o tronco e depois a copa florida
          if (a.tronco < a.maxTronco) a.tronco += 0.5;
          else if (a.copa < 35) a.copa += 0.3;
          else a.vida++;

          // Desenha o tronco
          ctx.fillStyle = '#6d4c41';
          ctx.fillRect(a.x - 4, chao - a.tronco, 8, a.tronco);

          // Desenha a copa da árvore com flores
          if (a.copa > 0) {
            ctx.fillStyle = '#27ae60';
            ctx.beginPath();
            ctx.arc(a.x, chao - a.tronco, a.copa, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = a.cor;
            ctx.beginPath();
            ctx.arc(a.x - 10, chao - a.tronco - 5, a.copa * 0.3, 0, Math.PI * 2);
            ctx.arc(a.x + 12, chao - a.tronco + 5, a.copa * 0.3, 0, Math.PI * 2);
            ctx.fill();
          }

          // Reinicia o ciclo sozinho após um tempo
          if (a.vida > 250) {
            a.y = -20;
            a.noChao = false;
            a.tronco = 0;
            a.copa = 0;
            a.vida = 0;
          }
        }
      });

      requestAnimationFrame(animar);
    }

    animar();
  </script>
</body>
</html>
