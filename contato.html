<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jardim Animado - Front-End</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script>
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');
    c.width = window.innerWidth;
    c.height = window.innerHeight;

    let t = 0;
    const cores = ['#ff7675', '#fdcb6e', '#ff9ff3', '#74b9ff'];
    const itens = Array.from({ length: 14 }, (_, i) => ({
      x: 70 + (i * (c.width - 140)) / 13, // Espalha na horizontal
      y: -Math.random() * 350,
      vel: 1.5 + Math.random(),
      tronco: 0,
      maxTronco: 55 + Math.random() * 55,
      copa: 0,
      cor: cores[i % cores.length],
      tempo: 0
    }));

    function desenhar() {
      t += 0.008;
      const dia = (Math.sin(t) + 1) / 2; // Vai de 0 (noite) a 1 (dia)
      const chao = c.height - 45;

      // Céu mudando de cor (dia e noite)
      ctx.fillStyle = `rgb(${15 + dia * 120}, ${25 + dia * 180}, ${55 + dia * 195})`;
      ctx.fillRect(0, 0, c.width, c.height);

      // Sol (de dia) e Lua (de noite)
      ctx.fillStyle = dia > 0.35 ? '#ffeaa7' : '#dfe6e9';
      ctx.beginPath();
      ctx.arc(c.width * 0.85, c.height - dia * (c.height - 90), 35, 0, Math.PI * 2);
      ctx.fill();

      // Grama horizontal
      ctx.fillStyle = dia > 0.35 ? '#2ecc71' : '#145a32';
      ctx.fillRect(0, chao, c.width, 45);

      // Flores caindo e virando árvores
      itens.forEach(p => {
        if (p.y < chao) {
          // 1. Flor caindo
          p.y += p.vel;
          ctx.fillStyle = p.cor;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // 2. Crescendo árvore
          if (p.tronco < p.maxTronco) p.tronco += 0.5;
          else if (p.copa < 32) p.copa += 0.3;
          else p.tempo++;

          ctx.fillStyle = '#5d4037'; // Tronco
          ctx.fillRect(p.x - 4, chao - p.tronco, 8, p.tronco);

          if (p.copa > 0) {
            ctx.fillStyle = '#27ae60'; // Folhas
            ctx.beginPath();
            ctx.arc(p.x, chao - p.tronco, p.copa, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = p.cor; // Flores na árvore
            ctx.beginPath();
            ctx.arc(p.x - 10, chao - p.tronco - 5, p.copa * 0.28, 0, Math.PI * 2);
            ctx.arc(p.x + 10, chao - p.tronco + 6, p.copa * 0.28, 0, Math.PI * 2);
            ctx.fill();
          }

          // Recomeça o ciclo sozinho
          if (p.tempo > 220) {
            p.y = -20; p.tronco = 0; p.copa = 0; p.tempo = 0;
          }
        }
      });

      requestAnimationFrame(desenhar);
    }

    desenhar();
  </script>
</body>
</html>
